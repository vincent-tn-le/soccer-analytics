[project]
name = "matchpulse"
version = "0.1.0"
description = "MatchPulse — Big Five soccer analytics data platform (DE MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "dagster>=1.8",
  "dagster-webserver>=1.8",
  "dbt-core>=1.8",
  "dbt-duckdb>=1.8",
  "duckdb>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "orchestration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
